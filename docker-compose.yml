services:
  postgres:
    image: postgres:17-alpine
    container_name: a-radius-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-a_radius}
      POSTGRES_USER: ${POSTGRES_USER:-a_radius}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-a_radius_dev_password_change_me}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/postgresql/migrations/0001_init.sql:/docker-entrypoint-initdb.d/01-0001_init.sql:ro
      - ./database/migrations/0002_subscription_profiles.up.sql:/docker-entrypoint-initdb.d/02-0002_subscription_profiles.up.sql:ro
      - ./docker/postgres/03-rbac-smoke.sql:/docker-entrypoint-initdb.d/03-rbac-smoke.sql:ro
      - ./database/postgresql/seeds/001_system.sql:/docker-entrypoint-initdb.d/04-system-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - a-radius

  profile-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: a-radius-profile-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PROFILE_API_ADDR: ":8080"
      DATABASE_URL: "postgres://${POSTGRES_USER:-a_radius}:${POSTGRES_PASSWORD:-a_radius_dev_password_change_me}@postgres:5432/${POSTGRES_DB:-a_radius}?sslmode=disable"
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-me-32-bytes-minimum}
      JWT_ISSUER: ${JWT_ISSUER:-a-radius}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-a-radius-api}
    ports:
      - "${API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8080/healthz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - a-radius

volumes:
  postgres_data:

networks:
  a-radius:
    driver: bridge
