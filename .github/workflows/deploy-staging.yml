name: Deploy Staging

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Optional image tag; defaults to the selected commit SHA'
        required: false
        type: string

concurrency:
  group: deploy-staging
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/a-radius-profile-api

jobs:
  deploy:
    name: Build and deploy to staging
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ vars.STAGING_PUBLIC_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve image tag
        id: image
        shell: bash
        run: |
          set -euo pipefail
          tag='${{ inputs.image_tag }}'
          if [ -z "$tag" ]; then
            tag="${GITHUB_SHA}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE_NAME}:$tag" >> "$GITHUB_OUTPUT"

      - name: Validate staging configuration
        shell: bash
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          STAGING_SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          STAGING_SSH_KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
          STAGING_APP_DIR: ${{ vars.STAGING_APP_DIR }}
          STAGING_HEALTHCHECK_URL: ${{ vars.STAGING_HEALTHCHECK_URL }}
          STAGING_GHCR_USERNAME: ${{ secrets.STAGING_GHCR_USERNAME }}
          STAGING_GHCR_TOKEN: ${{ secrets.STAGING_GHCR_TOKEN }}
        run: |
          set -euo pipefail
          for name in STAGING_HOST STAGING_SSH_USER STAGING_SSH_PRIVATE_KEY STAGING_SSH_KNOWN_HOSTS STAGING_APP_DIR STAGING_HEALTHCHECK_URL STAGING_GHCR_USERNAME STAGING_GHCR_TOKEN; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required staging configuration: $name" >&2
              exit 1
            fi
          done

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push staging image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.image }}
            ${{ env.IMAGE_NAME }}:staging
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Configure SSH
        shell: bash
        env:
          STAGING_SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          STAGING_SSH_KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$STAGING_SSH_PRIVATE_KEY" > "$HOME/.ssh/staging_key"
          chmod 600 "$HOME/.ssh/staging_key"
          printf '%s\n' "$STAGING_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 644 "$HOME/.ssh/known_hosts"

      - name: Authenticate staging host to GHCR
        shell: bash
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          STAGING_GHCR_USERNAME: ${{ secrets.STAGING_GHCR_USERNAME }}
          STAGING_GHCR_TOKEN: ${{ secrets.STAGING_GHCR_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$STAGING_GHCR_TOKEN" | ssh \
            -i "$HOME/.ssh/staging_key" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$STAGING_SSH_USER@$STAGING_HOST" \
            "docker login ghcr.io --username '$STAGING_GHCR_USERNAME' --password-stdin"

      - name: Deploy image on staging host
        shell: bash
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          STAGING_APP_DIR: ${{ vars.STAGING_APP_DIR }}
          STAGING_HEALTHCHECK_URL: ${{ vars.STAGING_HEALTHCHECK_URL }}
          DEPLOY_IMAGE: ${{ steps.image.outputs.image }}
        run: |
          set -euo pipefail
          ssh \
            -i "$HOME/.ssh/staging_key" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$STAGING_SSH_USER@$STAGING_HOST" \
            bash -s -- "$STAGING_APP_DIR" "$DEPLOY_IMAGE" "$STAGING_HEALTHCHECK_URL" <<'REMOTE'
          set -euo pipefail
          app_dir="$1"
          image="$2"
          health_url="$3"
          cd "$app_dir"
          export API_IMAGE="$image"
          docker compose pull api
          docker compose up -d --no-build api
          docker compose ps api
          curl --fail --silent --show-error --retry 20 --retry-delay 3 --retry-connrefused "$health_url"
          REMOTE

      - name: Deployment summary
        if: always()
        run: |
          {
            echo '### Staging deployment'
            echo
            echo "- Image: \\`${{ steps.image.outputs.image }}\\`"
            echo "- Commit: \\`${GITHUB_SHA}\\`"
            echo '- Production: unchanged'
          } >> "$GITHUB_STEP_SUMMARY"
