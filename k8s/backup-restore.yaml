apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: a-radius-postgres-backups
  namespace: a-radius
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: a-radius-postgres-backup
  namespace: a-radius
  labels:
    app.kubernetes.io/name: a-radius-postgres-backup
spec:
  schedule: "17 2 * * *"
  timeZone: "Etc/UTC"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: a-radius-postgres-backup
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            fsGroup: 999
          containers:
            - name: backup
              image: postgres:17-alpine
              imagePullPolicy: IfNotPresent
              envFrom:
                - configMapRef: {name: a-radius-config}
              env:
                - name: PGHOST
                  valueFrom: {configMapKeyRef: {name: a-radius-config, key: POSTGRES_HOST}}
                - name: PGPORT
                  valueFrom: {configMapKeyRef: {name: a-radius-config, key: POSTGRES_PORT}}
                - name: PGUSER
                  valueFrom: {configMapKeyRef: {name: a-radius-config, key: POSTGRES_USER}}
                - name: PGDATABASE
                  valueFrom: {configMapKeyRef: {name: a-radius-config, key: POSTGRES_DB}}
                - name: PGPASSWORD
                  valueFrom: {secretKeyRef: {name: a-radius-secrets, key: POSTGRES_PASSWORD}}
                - name: BACKUP_DIR
                  value: /backups
                - name: RETENTION_DAYS
                  value: "30"
              command: ["/bin/sh", "/scripts/pg-backup.sh"]
              volumeMounts:
                - name: backups
                  mountPath: /backups
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
              resources:
                requests: {cpu: 50m, memory: 128Mi}
                limits: {cpu: 500m, memory: 512Mi}
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: {drop: [ALL]}
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: a-radius-postgres-backups
            - name: scripts
              configMap:
                name: a-radius-postgres-backup-scripts
                defaultMode: 0555
---
apiVersion: batch/v1
kind: Job
metadata:
  name: a-radius-postgres-restore-example
  namespace: a-radius
  labels:
    app.kubernetes.io/name: a-radius-postgres-restore
spec:
  suspend: true
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: a-radius-postgres-restore
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        fsGroup: 999
      containers:
        - name: restore
          image: postgres:17-alpine
          envFrom:
            - configMapRef: {name: a-radius-config}
          env:
            - name: PGHOST
              valueFrom: {configMapKeyRef: {name: a-radius-config, key: POSTGRES_HOST}}
            - name: PGPORT
              valueFrom: {configMapKeyRef: {name: a-radius-config, key: POSTGRES_PORT}}
            - name: PGUSER
              valueFrom: {configMapKeyRef: {name: a-radius-config, key: POSTGRES_USER}}
            - name: PGDATABASE
              valueFrom: {configMapKeyRef: {name: a-radius-config, key: POSTGRES_DB}}
            - name: PGPASSWORD
              valueFrom: {secretKeyRef: {name: a-radius-secrets, key: POSTGRES_PASSWORD}}
            - name: BACKUP_DIR
              value: /backups
            - name: BACKUP_FILE
              value: /backups/CHANGE_ME.dump
            - name: CONFIRM_RESTORE
              value: "NO"
            - name: ALLOW_DROP
              value: "NO"
          command: ["/bin/sh", "/scripts/pg-restore.sh"]
          volumeMounts:
            - name: backups
              mountPath: /backups
              readOnly: true
            - name: scripts
              mountPath: /scripts
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
      volumes:
        - name: backups
          persistentVolumeClaim:
            claimName: a-radius-postgres-backups
        - name: scripts
          configMap:
            name: a-radius-postgres-backup-scripts
            defaultMode: 0555
