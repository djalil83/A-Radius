services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: apb
      POSTGRES_USER: apb
      POSTGRES_PASSWORD: CHANGE_ME
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
volumes:
  postgres_data:
