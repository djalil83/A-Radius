openapi: 3.0.3
info:
  title: A-Radius Subscription Profile API
  version: 1.0.0
  description: |
    API untuk mengelola profile berlangganan ISP A-Radius.

    Update dan archive menggunakan optimistic locking. Client wajib mengirim
    nilai `version` terakhir yang dibaca. Jika profile sudah berubah oleh
    request lain, server mengembalikan HTTP 409 dengan code `VERSION_CONFLICT`.
servers:
  - url: http://localhost:8080
    description: Local development
  - url: https://api.example.invalid
    description: Production placeholder

tags:
  - name: Subscription Profiles
    description: CRUD profile berlangganan dan optimistic locking
  - name: Revisions
    description: Riwayat perubahan profile

security:
  - tenantIdentity: []
    actorIdentity: []

paths:
  /api/v1/subscription-profiles:
    get:
      tags: [Subscription Profiles]
      summary: List subscription profiles
      operationId: listSubscriptionProfiles
      parameters:
        - $ref: '#/components/parameters/Query'
        - $ref: '#/components/parameters/ServiceType'
        - $ref: '#/components/parameters/Status'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Profile berhasil diambil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Subscription Profiles]
      summary: Create subscription profile
      operationId: createSubscriptionProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileInput'
            example:
              name: Fiber Home 20 Mbps
              service_type: FTTH
              color: '#2563EB'
              upload_bps: 10000000
              download_bps: 20000000
              shared_users: 1
              monthly_price: 150000
              active_days: 30
              commission_amount: 0
              commission_type: RUPIAH
              billing_cycle: MONTHLY
              auto_isolate: true
      responses:
        '201':
          description: Profile berhasil dibuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '409':
          description: Nama profile sudah digunakan pada tenant yang sama
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: DUPLICATE_NAME
                  message: a profile with this name already exists
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/subscription-profiles/{id}:
    parameters:
      - $ref: '#/components/parameters/ProfileID'
    get:
      tags: [Subscription Profiles]
      summary: Get one subscription profile
      operationId: getSubscriptionProfile
      responses:
        '200':
          description: Profile ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags: [Subscription Profiles]
      summary: Update subscription profile with optimistic locking
      operationId: updateSubscriptionProfile
      description: |
        Update bersifat atomic pada database. `version` harus sama dengan
        versi terakhir yang dibaca client. Server menaikkan version tepat satu
        setelah update berhasil.

        Jika dua request menggunakan version yang sama, hanya satu request
        yang dapat berhasil. Request lainnya menerima HTTP 409 dan harus
        mengambil ulang profile sebelum mencoba lagi.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/ProfileInput'
                - type: object
                  required: [version]
                  properties:
                    version:
                      type: integer
                      format: int64
                      minimum: 1
                      description: Versi profile yang terakhir dibaca client
            example:
              name: Fiber Home 20 Mbps Updated
              service_type: FTTH
              color: '#2563EB'
              shared_users: 1
              monthly_price: 175000
              active_days: 30
              commission_amount: 0
              commission_type: RUPIAH
              billing_cycle: MONTHLY
              auto_isolate: true
              version: 3
      responses:
        '200':
          description: Profile berhasil diperbarui; version bertambah satu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/VersionConflict'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Subscription Profiles]
      summary: Archive subscription profile with optimistic locking
      operationId: archiveSubscriptionProfile
      description: |
        Archive adalah soft delete. Client wajib mengirim query parameter
        `version`. Operasi yang berhasil mengubah status menjadi `ARCHIVED`
        dan menaikkan version tepat satu.
      parameters:
        - $ref: '#/components/parameters/VersionQuery'
      responses:
        '204':
          description: Profile berhasil diarsipkan
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/VersionConflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/subscription-profiles/{id}/revisions:
    parameters:
      - $ref: '#/components/parameters/ProfileID'
    get:
      tags: [Revisions]
      summary: List profile revision history
      operationId: listSubscriptionProfileRevisions
      parameters:
        - $ref: '#/components/parameters/RevisionLimit'
      responses:
        '200':
          description: Revision history berhasil diambil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevisionList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  securitySchemes:
    tenantIdentity:
      type: apiKey
      in: header
      name: X-Tenant-ID
      description: Temporary tenant identity adapter; replace with production auth middleware.
    actorIdentity:
      type: apiKey
      in: header
      name: X-Actor-ID
      description: Temporary actor identity adapter; replace with production auth middleware.
  parameters:
    ProfileID:
      name: id
      in: path
      required: true
      description: UUID profile berlangganan
      schema:
        type: string
        format: uuid
    Query:
      name: q
      in: query
      required: false
      schema:
        type: string
        maxLength: 160
    ServiceType:
      name: service_type
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/ServiceType'
    Status:
      name: status
      in: query
      required: false
      schema:
        type: string
        enum: [ACTIVE, ARCHIVED]
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    Offset:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        maximum: 1000000
        default: 0
    VersionQuery:
      name: version
      in: query
      required: true
      description: Versi terakhir yang dibaca client untuk optimistic locking
      schema:
        type: integer
        format: int64
        minimum: 1
    RevisionLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
  responses:
    Unauthenticated:
      description: Header identity belum tersedia atau tidak valid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: UNAUTHENTICATED
              message: X-Tenant-ID and X-Actor-ID are required
    ValidationError:
      description: Request tidak memenuhi validasi
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: VALIDATION_ERROR
              message: version must be >= 1
    NotFound:
      description: Profile tidak ditemukan atau sudah tidak aktif
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: NOT_FOUND
              message: subscription profile not found
    VersionConflict:
      description: |
        Conflict optimistic locking. Profile telah diubah atau diarsipkan
        oleh request lain setelah client membaca version.
      headers:
        Cache-Control:
          schema:
            type: string
          description: Response conflict tidak boleh disimpan sebagai cache.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: VERSION_CONFLICT
              message: profile was changed by another request; reload before updating
    InternalError:
      description: Kesalahan internal server
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    ServiceType:
      type: string
      enum: [FTTH, PPPOE, HOTSPOT_VOUCHER, STATIC_IP]
    CommissionType:
      type: string
      enum: [RUPIAH, PERCENT]
    BillingCycle:
      type: string
      enum: [DAILY, WEEKLY, MONTHLY, CUSTOM]
    ProfileInput:
      type: object
      required:
        - name
        - service_type
        - color
        - shared_users
        - monthly_price
        - active_days
        - commission_amount
        - commission_type
        - billing_cycle
      properties:
        name:
          type: string
          maxLength: 160
        service_type:
          $ref: '#/components/schemas/ServiceType'
        category:
          type: string
          nullable: true
        media:
          type: string
          nullable: true
        color:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
          default: '#1677ff'
        description:
          type: string
          maxLength: 2000
          nullable: true
        mikrotik_group:
          type: string
          nullable: true
        radius_group:
          type: string
          nullable: true
        rate_limit:
          type: string
          maxLength: 512
          nullable: true
        upload_bps:
          type: integer
          format: int64
          minimum: 0
          nullable: true
        download_bps:
          type: integer
          format: int64
          minimum: 0
          nullable: true
        shared_users:
          type: integer
          minimum: 1
          default: 1
        vlan_id:
          type: integer
          minimum: 1
          maximum: 4094
          nullable: true
        olt_profile:
          type: string
          nullable: true
        ip_pool:
          type: string
          nullable: true
        monthly_price:
          type: integer
          format: int64
          minimum: 0
        active_days:
          type: integer
          minimum: 0
          default: 30
        commission_amount:
          type: integer
          format: int64
          minimum: 0
        commission_type:
          $ref: '#/components/schemas/CommissionType'
        billing_cycle:
          $ref: '#/components/schemas/BillingCycle'
        auto_isolate:
          type: boolean
          default: true
        billing_note:
          type: string
          maxLength: 2000
          nullable: true
    Profile:
      allOf:
        - $ref: '#/components/schemas/ProfileInput'
        - type: object
          required: [id, tenant_id, status, version, created_at, updated_at]
          properties:
            id:
              type: string
              format: uuid
            tenant_id:
              type: string
              format: uuid
            status:
              type: string
              enum: [ACTIVE, ARCHIVED]
            version:
              type: integer
              format: int64
              minimum: 1
            created_by:
              type: string
              format: uuid
              nullable: true
            updated_by:
              type: string
              format: uuid
              nullable: true
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
    ProfileList:
      type: object
      required: [items, limit, offset]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Profile'
        limit:
          type: integer
        offset:
          type: integer
    Revision:
      type: object
      required: [id, profile_id, version, operation, snapshot, changed_at]
      properties:
        id:
          type: integer
          format: int64
        profile_id:
          type: string
          format: uuid
        version:
          type: integer
          format: int64
        operation:
          type: string
          description: Operasi yang menghasilkan snapshot revision
          example: UPDATE
        snapshot:
          type: string
          format: byte
          description: JSON snapshot yang diserialisasi sebagai base64 oleh encoding/json Go
        changed_by:
          type: string
          format: uuid
          nullable: true
        changed_at:
          type: string
          format: date-time
    RevisionList:
      type: object
      required: [items, limit]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Revision'
        limit:
          type: integer
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - UNAUTHENTICATED
                - INVALID_JSON
                - VALIDATION_ERROR
                - NOT_FOUND
                - VERSION_CONFLICT
                - DUPLICATE_NAME
                - INTERNAL_ERROR
            message:
              type: string
